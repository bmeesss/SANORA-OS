#
# SANORA OS Calamares partition-module configuration.
#
# This uses Calamares' own supported module configuration only -- no custom
# disk-management code. Debian's calamares-settings-debian does not ship a
# partition.conf, so Calamares falls back to compiled defaults (LUKS1).
# Installing this file at /etc/calamares/modules/ overrides those defaults.
#
# Keys verified against Calamares src/modules/partition/partition.conf and
# partition.schema.yaml (retrieved 2026-11-02 from the upstream source tree).
# `userSwapChoices` is required by the schema.
#
# Target layout: UEFI + GPT + EFI System Partition + LUKS2 + Linux filesystem.
# Calamares' automated "Erase disk" partitioning on UEFI creates GPT and the
# ESP; luksGeneration selects LUKS2 for the encrypted root.
#
# IMPORTANT CAVEAT (documented, not hidden): upstream Calamares notes that
# GRUB does not support LUKS2 with Argon2id and only supports LUKS2 with
# PBKDF2. Until an installation is performed and rebooted, encrypted
# installation is NOT claimed to work. See docs/decisions/0010-luks2-installer.md.

efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

userSwapChoices:
    - none
    - small
    - suspend

luksGeneration:                     luks2
enableLuksAutomatedPartitioning:    true
allowManualPartitioning:            true
