# SPDX-License-Identifier: GPL-2.0-or-later
#
# SANORA OS Calamares partition-module configuration.
#
# This uses Calamares' own supported module configuration only -- no custom
# disk-management code. Debian's calamares-settings-debian 13.0.13-1 does not
# ship a partition.conf, so Calamares falls back to compiled defaults (LUKS1).
# Installing this file at /etc/calamares/modules/ overrides those defaults.
#
# Keys verified against Calamares 3.3.14 (Debian trixie)
# src/modules/partition/partition.conf and partition.schema.yaml, retrieved
# 2026-11-02 from the upstream v3.3.14 source tree. `userSwapChoices` is
# required by the schema.
#
# Target layout: UEFI + GPT + EFI System Partition + unencrypted /boot +
# LUKS2 encrypted / (ext4 Linux filesystem). Calamares prepends the ESP
# automatically on UEFI.
#
# GRUB / LUKS2 / Argon2id investigation (ADR-0011):
#   * Calamares 3.3.14 exposes only `luksGeneration`; there is NO key to
#     select the PBKDF. cryptsetup's LUKS2 default is Argon2id.
#   * GRUB 2.12 (Debian trixie) can read LUKS2 only when the keyslot uses
#     PBKDF2; it cannot unlock an Argon2id keyslot.
#   * Forcing PBKDF2 would require overriding cryptsetup's KDF (weaker than
#     Argon2id) and is not exposed by Calamares. Instead SANORA keeps an
#     unencrypted /boot partition: GRUB reads the kernel and initramfs from
#     plain ext4 and never has to unlock the LUKS2 volume. The initramfs
#     (cryptsetup-initramfs) unlocks the Argon2id root volume at boot.
#   * Security implication: /boot is readable without the passphrase. Kernel,
#     initramfs and any embedded keyfile are exposed to an attacker with
#     physical disk access; the LUKS2 volume itself remains protected.
#     This is the standard Debian-style trade-off and is documented rather
#     than hidden. See docs/decisions/0011-luks2-grub-argon2id.md.

efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# Explicit layout so GRUB never needs to read an encrypted filesystem.
partitionLayout:
    - name: "SANORA-BOOT"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1G
      minSize: 512M
      maxSize: 2G
    - name: "SANORA-ROOT"
      filesystem: "ext4"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
      minSize: 8G

userSwapChoices:
    - none
    - small
    - suspend

initialPartitioningChoice:            erase
initialSwapChoice:                    none
defaultFileSystemType:                ext4

luksGeneration:                       luks2
enableLuksAutomatedPartitioning:      true
preCheckEncryption:                   false
allowManualPartitioning:              true
