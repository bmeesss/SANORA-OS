name: Build and boot-test development ISO

# Real Debian 13 "trixie" build environment with network access.
#
# Triggering: `workflow_dispatch` is not available to the repository's CI
# token (HTTP 403), and `release`/`schedule` only apply to the default branch.
# A push to a dedicated marker file is therefore the reliable way to request a
# real ISO build on this working branch. No ISO is built on every commit.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this ISO being built?"
        required: false
        default: "manual development build"
  push:
    branches: [ "arena/fa064594-sanora-os" ]
    paths:
      - ".github/ISO_BUILD_TRIGGER"
  release:
    types: [ published ]
  schedule:
    # Sundays at 04:17 UTC.
    - cron: "17 4 * * 0"

permissions:
  contents: read
  checks: write     # publish the full build log as a readable check-run output
  actions: read

jobs:
  iso:
    name: Build ISO and boot it in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: debian:trixie
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
      # Generate an ephemeral development GPG key for the signed APT repo.
      # A release build must set SANORA_REPO_KEY_ID to an offline-managed key.
      SANORA_REPO_AUTO_KEY: "1"
    steps:
      - name: Install build and boot-test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools syslinux-common \
            isolinux grub-efi-amd64-bin dosfstools mtools dpkg-dev git python3 \
            python3-pexpect curl ca-certificates coreutils findutils procps \
            cpio apt-utils bzip2 cryptsetup file rsync wget xz-utils \
            e2fsprogs parted systemd-container gzip zstd \
            qemu-system-x86 ovmf qemu-utils netpbm \
            gnupg diffoscope xorriso

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          . /etc/os-release && echo "Host: $PRETTY_NAME"
          # Container jobs can trip git's "dubious ownership" check; add the
          # workspace so build.sh can derive SOURCE_DATE_EPOCH and the commit.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "Commit: $(git rev-parse HEAD)"
          echo "live-build: $(lb --version 2>/dev/null || echo unknown)"
          echo "QEMU: $(qemu-system-x86_64 --version | head -1)"
          echo "KVM: $(test -w /dev/kvm && echo available || echo unavailable)"
          echo "OVMF: $(ls /usr/share/qemu/OVMF.fd /usr/share/OVMF/OVMF_CODE_4M.fd 2>/dev/null | tr '\n' ' ')"

      - name: Preflight (host dependencies + Debian mirror)
        run: SANORA_SKIP_NETWORK_CHECK=0 bash build/scripts/preflight.sh

      - name: Build ISO with the existing build system
        # `tee` opens its output file immediately, so build/work must exist
        # BEFORE the pipeline starts. Without this mkdir, tee failed to open
        # build/work/build-full.log in a fresh checkout and the step was
        # reported as failed even though ./build.sh produced a valid ISO.
        run: |
          mkdir -p build/work
          set -o pipefail
          ./build.sh 2>&1 | tee build/work/build-full.log

      - name: Collect measured component versions
        if: success()
        run: bash build/scripts/collect-versions.sh

      - name: Reproducibility - rebuild the same commit
        if: success()
        run: |
          set -e
          FIRST_ISO="$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          FIRST_SHA="$(sha256sum "$FIRST_ISO" | awk '{print $1}')"
          cp out/build-metadata.json /tmp/first-metadata.json
          cp out/chroot-file-list.txt /tmp/first-chroot-file-list.txt
          mv "$FIRST_ISO" /tmp/sanora-first.iso
          echo "First ISO sha256: $FIRST_SHA"
          # Clean everything generated by the first build, then build again
          # from exactly the same commit and SOURCE_DATE_EPOCH.
          ./build.sh --clean
          mkdir -p build/work
          # Do NOT use a `... | tee` pipeline here: without pipefail in this
          # shell, a failing build.sh would be masked by tee's exit code.
          set +e
          ./build.sh > build/work/second-build.log 2>&1
          SECOND_RC=$?
          set -e
          cat build/work/second-build.log
          echo "::notice::second build exit code: $SECOND_RC"
          if [ "$SECOND_RC" -ne 0 ]; then
            # Keep a valid ISO for boot validation and the artifact rather
            # than silently losing the first one. The failure stays visible.
            cp /tmp/sanora-first.iso out/sanora-0.1.0-dev-amd64.iso
            printf 'second build FAILED (exit %s); first ISO restored for validation\n' \
              "$SECOND_RC" > out/second-build-failure.txt
            echo "::error::second ISO build failed with exit $SECOND_RC"
          fi
          SECOND_ISO="$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          SECOND_SHA="$(sha256sum "$SECOND_ISO" | awk '{print $1}')"
          echo "Second ISO sha256: $SECOND_SHA"
          if [ "$FIRST_SHA" != "$SECOND_SHA" ]; then
            # Locate the first differing bytes so the non-reproducible
            # component can be identified rather than merely noted.
            cmp -l /tmp/sanora-first.iso "$SECOND_ISO" 2>/dev/null \
              | head -20 > out/byte-diff.txt || true
            FIRST_OFFSET="$(awk 'NR==1 {print $1}' out/byte-diff.txt || true)"
            if [ -n "$FIRST_OFFSET" ]; then
              START=$((FIRST_OFFSET > 64 ? FIRST_OFFSET - 64 : 1))
              {
                echo "First differing byte offset (1-based): $FIRST_OFFSET"
                echo "--- first ISO bytes around offset ---"
                dd if=/tmp/sanora-first.iso bs=1 skip="$START" count=128 \
                  2>/dev/null | od -Ax -tx1z -v
                echo "--- second ISO bytes around offset ---"
                dd if="$SECOND_ISO" bs=1 skip="$START" count=128 \
                  2>/dev/null | od -Ax -tx1z -v
              } > out/byte-diff-context.txt
              cat out/byte-diff-context.txt
            fi
          fi
          FIRST_SHA="$FIRST_SHA" SECOND_SHA="$SECOND_SHA" python3 - <<'PY'
          import json, os, pathlib
          first = json.loads(pathlib.Path("/tmp/first-metadata.json").read_text())
          second = json.loads(pathlib.Path("out/build-metadata.json").read_text())
          def flat(d, prefix=""):
              out = {}
              for k, v in d.items():
                  key = f"{prefix}{k}"
                  if isinstance(v, dict):
                      out.update(flat(v, key + "."))
                  else:
                      out[key] = v
              return out
          a, b = flat(first), flat(second)
          differences = {
              k: [a.get(k), b.get(k)]
              for k in sorted(set(a) | set(b))
              if a.get(k) != b.get(k)
          }
          report = {
              "first_sha256": os.environ["FIRST_SHA"],
              "second_sha256": os.environ["SECOND_SHA"],
              "identical": os.environ["FIRST_SHA"] == os.environ["SECOND_SHA"],
              "metadata_differences": differences,
          }
          pathlib.Path("out/reproducibility.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Reproducibility - diffoscope and file-level diff
        if: always()
        run: |
          # Never let analysis abort the build job. Disk is limited: do NOT
          # extract two squashfs images. Compare cheap chroot file listings
          # and run diffoscope with bounded container recursion instead.
          set +e
          SECOND_ISO="$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          echo "=== chroot file-list differences (path|type|size|mtime|mode|uid|gid) ==="
          if [ -f /tmp/first-chroot-file-list.txt ] && [ -f out/chroot-file-list.txt ]; then
            diff /tmp/first-chroot-file-list.txt out/chroot-file-list.txt \
              > out/squashfs-metadata-diff.txt 2>&1
            echo "differing lines: $(wc -l < out/squashfs-metadata-diff.txt)"
            head -100 out/squashfs-metadata-diff.txt
          else
            echo "chroot file list missing on one side" > out/squashfs-metadata-diff.txt
          fi
          echo "=== diffoscope (bounded, no squashfs extraction) ==="
          if [ -f /tmp/sanora-first.iso ] && [ -n "$SECOND_ISO" ]; then
            timeout 600 diffoscope \
              --max-container-depth 1 --max-text-report-size 120000 \
              /tmp/sanora-first.iso "$SECOND_ISO" > out/diffoscope.txt 2>&1
            echo "diffoscope exit: $?" >> out/diffoscope.txt
            head -120 out/diffoscope.txt
          else
            echo "ISO pair not available" > out/diffoscope.txt
          fi
          # Free the retained first ISO and the live-build chroot before the
          # 3.8 GB Debian baseline ISO is downloaded.
          cp build/work/live/build.log out/lb-build.log 2>/dev/null || true
          rm -f /tmp/sanora-first.iso
          rm -rf build/work/live
          df -h / || true
          exit 0

      - name: Show build metadata
        if: always()
        run: |
          echo "--- out/ ---"; ls -la out/ || true
          echo "--- build-metadata.json ---"; cat out/build-metadata.json || true
          echo "--- build.log tail ---"; tail -60 build/work/live/build.log || true

      - name: Boot validation - UEFI (primary)
        if: always()
        run: |
          ISO="$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          echo "::notice::UEFI boot test ISO='${ISO}'"
          set +e
          python3 tests/boot/qemu_boot.py --iso "$ISO" --mode uefi \
            --out out/boot-uefi --timeout 420
          rc=$?
          set -e
          cat out/boot-uefi/boot-validation.json || true
          echo "::notice::UEFI boot harness exit: $rc"
          exit "$rc"

      - name: Boot validation - Legacy BIOS
        if: always()
        run: |
          ISO="$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          echo "::notice::BIOS boot test ISO='${ISO}'"
          set +e
          python3 tests/boot/qemu_boot.py --iso "$ISO" --mode bios \
            --out out/boot-bios --timeout 300
          rc=$?
          set -e
          cat out/boot-bios/boot-validation.json || true
          echo "::notice::BIOS boot harness exit: $rc"
          exit "$rc"

      - name: Performance baseline - unmodified Debian 13 KDE
        if: always()
        run: |
          set +e
          URL="https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid/debian-live-13.7.0-amd64-kde.iso"
          echo "Downloading stock Debian KDE live ISO for an apples-to-apples baseline"
          curl -fL --retry 2 --max-time 1500 -o /tmp/debian-kde.iso "$URL"
          if [ -s /tmp/debian-kde.iso ]; then
            echo "Debian ISO size: $(stat -c %s /tmp/debian-kde.iso)"
            python3 tests/boot/qemu_baseline.py \
              --debian-iso /tmp/debian-kde.iso \
              --out out/baseline \
              --sanora-boot out/boot-uefi/boot-validation.json \
              --sanora-perf out/boot-uefi/performance-baseline.txt \
              --timeout 600
            cat out/baseline/baseline-comparison.json || true
          else
            echo "Debian ISO download failed; baseline NOT measured" \
              > out/baseline-comparison.json
          fi
          rm -f /tmp/debian-kde.iso
          set -e

      - name: Upload ISO, metadata and boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanora-iso-and-evidence
          path: |
            out/
            build/work/build-full.log
            build/work/live/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish complete build log as a readable check run
        if: always()
        env:
          API_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, pathlib
          wanted = [
              "out/boot-uefi/boot-validation.json",
              "out/boot-bios/boot-validation.json",
              "out/boot-uefi/guest-checks.txt",
              "out/boot-uefi/locale-checks.txt",
              "out/boot-uefi/calamares-checks.txt",
              "out/boot-uefi/performance-baseline.txt",
              "out/boot-uefi/theme-checks.txt",
              "out/boot-uefi/serial.log",
              "out/build-metadata.json",
              "out/reproducibility.json",
              "out/byte-diff.txt",
              "out/byte-diff-context.txt",
              "out/diffoscope.txt",
              "out/squashfs-metadata-diff.txt",
              "out/baseline/baseline-comparison.json",
              "out/baseline/debian-baseline.txt",
              "build/work/repo-metadata.json",
              "build/work/versions.json",
              "build/work/build-full.log",
              "out/lb-build.log",
              "out/chroot-file-list.txt",
              "out/second-build-failure.txt",
          ]
          parts = []
          for name in wanted:
              p = pathlib.Path(name)
              if p.is_file():
                  body = p.read_text(errors="replace")
                  # Keep the useful tail of large logs.
                  if len(body) > 12000:
                      body = "...[truncated]...\n" + body[-12000:]
                  parts.append(f"===== {name} =====\n{body}")
          # Downscaled desktop screenshot, base64, for local visual inspection.
          import base64, subprocess as sp
          ppm = pathlib.Path("out/boot-uefi/desktop.ppm")
          if ppm.is_file():
              try:
                  small = sp.run(
                      ["pnmscale", "-xsize=360", "-ysize=225", str(ppm)],
                      capture_output=True, check=True,
                  ).stdout
                  png = sp.run(
                      ["pnmtopng"], input=small, capture_output=True, check=True
                  ).stdout
                  b64 = base64.b64encode(png).decode()
                  if len(b64) < 22000:
                      parts.append("===== DESKTOP SCREENSHOT (base64 PNG) =====\n" + b64)
                      print("desktop screenshot base64 bytes:", len(b64))
              except (OSError, sp.CalledProcessError) as exc:
                  print("screenshot downscale skipped:", exc)
          text = "\n".join(parts) if parts else "(no build/boot evidence produced)"
          # GitHub check-run output.text is limited to 65535 characters.
          text = text[-60000:]
          body = {
              "name": "SANORA build diagnostics",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {
                  "title": "SANORA ISO build diagnostics (run " + os.environ["RUN_ID"] + ")",
                  "summary": "Complete build output, most recent lines retained.",
                  "text": text,
              },
          }
          pathlib.Path("/tmp/sanora-check.json").write_text(json.dumps(body))
          print("diagnostic payload bytes:", len(json.dumps(body)))
          PY
          curl -sS -f -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/sanora-check.json \
            "https://api.github.com/repos/$REPOSITORY/check-runs" \
            > /tmp/sanora-check-response.json
          python3 -c "import json;d=json.load(open('/tmp/sanora-check-response.json'));print('check-run id',d['id'])"
