name: Inspect ISO evidence

# Publishes selected small evidence files from a previous ISO run as a
# readable check run, because this sandbox cannot download Actions logs or
# artifacts from the Azure blob hosts.

on:
  push:
    branches: [ "arena/fa064594-sanora-os" ]
    paths:
      - ".github/INSPECT_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read source run id
        id: src
        run: |
          RID="$(grep -oE 'source-run-id: *[0-9]+' .github/INSPECT_TRIGGER | awk '{print $2}')"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Source run: $RID"

      - name: Download evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: sanora-iso-and-evidence
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/evidence

      - name: Read install run id
        id: ins
        run: |
          RID="$(grep -oE 'install-run-id: *[0-9]+' .github/INSPECT_TRIGGER | awk '{print $2}')"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Install run: $RID"

      - name: Download installer screenshots
        if: steps.ins.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: sanora-install-evidence
          run-id: ${{ steps.ins.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/install-evidence

      - name: Publish evidence as check run
        env:
          API_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("/tmp/evidence")
          wanted = [
              "out/boot-uefi/boot-validation.json",
              "out/boot-bios/boot-validation.json",
              "out/boot-uefi/theme-checks.txt",
              "out/boot-uefi/performance-baseline.txt",
              "out/build-metadata.json",
              "out/reproducibility.json",
              "out/diffoscope.txt",
              "out/squashfs-metadata-diff.txt",
              "out/iso-listing-diff.txt",
              "out/squashfs-sizes.txt",
              "out/squashfs-list-1.txt",
              "out/squashfs-list-2.txt",
              "out/byte-diff.txt",
              "out/repro-inputs.txt",
              "out/baseline/baseline-comparison.json",
              "build/work/repo-metadata.json",
              "build/work/versions.json",
          ]
          parts = []
          for name in wanted:
              p = root / name
              if p.is_file():
                  body = p.read_text(errors="replace")
                  # diffoscope.txt is the primary Phase 3.1 evidence; keep a
                  # generous slice from the START so the superblock/squashfs
                  # analysis is visible. Other files keep their tail.
                  limit = 30000 if name.endswith("diffoscope.txt") else 6000
                  if len(body) > limit:
                      if name.endswith("diffoscope.txt"):
                          body = body[:limit] + "\n...[truncated]..."
                      else:
                          body = "...[truncated]...\n" + body[-limit:]
                  parts.append(f"===== {name} =====\n{body}")
          # Install screenshots first so they survive the 60k truncation.
          shots = []
          ip = pathlib.Path("/tmp/install-evidence")
          for b64 in sorted(ip.rglob("*.png.b64")):
              data = b64.read_text(errors="replace")
              if len(data) < 20000:
                  shots.append(f"===== SCREENSHOT {b64.name} =====\n{data}")
          head = "\n".join(shots[:3])
          budget = 60000 - len(head) - 2000
          body_text = "\n".join(parts) if parts else "(no evidence files found)"
          if len(body_text) > budget and budget > 0:
              body_text = body_text[:budget] + "\n...[truncated]..."
          text = (head + "\n" + body_text)[:60000]
          body = {
              "name": "SANORA ISO evidence inspection",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {
                  "title": "SANORA ISO evidence inspection",
                  "summary": "Selected build/boot/reproducibility evidence.",
                  "text": text,
              },
          }
          pathlib.Path("/tmp/inspect.json").write_text(json.dumps(body))
          print("payload bytes:", len(json.dumps(body)))
          PY
          curl -sS -f -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/inspect.json \
            "https://api.github.com/repos/$REPOSITORY/check-runs" > /tmp/inspect-response.json
          python3 -c "import json;print('check-run id',json.load(open('/tmp/inspect-response.json'))['id'])"
