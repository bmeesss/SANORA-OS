# SANORA OS system defaults. Plain key=value, no secrets, no locale-specific
# text. Version information comes from /etc/os-release and
# /etc/sanora/build-info, not from this file, so there is one source of truth.
SANORA_ID=sanora
SANORA_NAME="SANORA OS"
SANORA_DEFAULT_LANGUAGE=en
SANORA_DEFAULT_LOCALE=en_US.UTF-8
SANORA_SUPPORTED_ARCHITECTURE=amd64
SANORA_BASE_DISTRIBUTION=debian
SANORA_BASE_SUITE=trixie
SANORA_INTERNATIONAL=true
